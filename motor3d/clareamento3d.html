<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"DM Sans",sans-serif;color:#fff;background:#120305}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 42% at 50% 54%,transparent 38%,rgba(8,2,3,.94) 100%)}
#topfade{position:absolute;left:0;right:0;top:0;height:700px;background:linear-gradient(#0b0203 0%,rgba(11,2,3,.88) 50%,transparent 100%)}
#botfade{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(transparent,rgba(11,2,3,.9) 60%,#0b0203)}
.brand{position:absolute;top:110px;left:60px;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700}
.brand .av{width:74px;height:74px;border-radius:50%;background:#4fd1c5;display:flex;align-items:center;justify-content:center}
.bar{position:absolute;top:60px;left:50px;right:50px;display:flex;gap:10px}
.bar i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:#fff}
.cap{position:absolute;left:70px;right:70px;top:240px;height:330px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0}
.cap div{font-size:82px;font-weight:800;line-height:1.1;letter-spacing:-2px;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.cap.small div{font-size:70px}
.cap .k{color:#5fe0d3}
#mes{position:absolute;bottom:300px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0}
#mes .n{font-size:44px;font-weight:800;letter-spacing:6px}
#mes .track{width:520px;height:12px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
#mes .track b{display:block;height:100%;width:0;background:#5fe0d3}
.star{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;opacity:0}
#fim{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px;opacity:0;background:rgba(8,2,3,.86)}
#fim .q{font-size:92px;font-weight:800;line-height:1.1;letter-spacing:-2px}
#fim .q .k{color:#5fe0d3}
#fim .follow{margin-top:80px;padding:38px 70px;border-radius:999px;background:#4fd1c5;color:#06141c;font-size:52px;font-weight:800}
#fim .sub{margin-top:36px;font-size:42px;color:rgba(255,255,255,.75)}
#credit{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:24px;color:rgba(255,255,255,.5);letter-spacing:1px}
</style></head><body>
<canvas id="c" width="720" height="1280"></canvas>
<div id="vig"></div><div id="topfade"></div><div id="botfade"></div><div id="fx"></div>
<div class="bar" id="bar"></div>
<div class="brand"><div class="av"><svg width="40" height="44" viewBox="0 0 100 110"><path d="M50 14C40 4 14 2 10 26c-3 18 6 30 10 52 3 18 8 28 14 28 7 0 7-26 16-26s9 26 16 26c6 0 11-10 14-28 4-22 13-34 10-52C86 2 60 4 50 14z" fill="#06141c"/></svg></div>OTH Odontologia</div>
<div id="caps"></div>
<div id="mes"><div class="n" id="mesn">COR A3,5</div><div class="track"><b id="mesb"></b></div></div><div id="glow" style="position:absolute;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(120,255,240,.55),rgba(79,209,197,0) 65%);opacity:0;mix-blend-mode:screen"></div>
<div id="fim"><div class="q">Você faria <span class="k">clareamento</span>?</div><div class="follow">Comenta aqui</div><div class="sub">Siga para mais dicas de odontologia</div></div>
<div id="credit">Animação 3D ilustrativa · Modelo: University of Dundee (CC BY 4.0)</div>
<script src="dental3d.js"></script>
<script>
const CAPS = [
  [0.2, 3.4, 'Dentes <span class="k">amarelados</span>?'],
  [3.4, 6.6, 'Café, chá e o tempo <span class="k">escurecem</span> os dentes.', 'small'],
  [6.6, 9.8, 'No clareamento, um <span class="k">gel</span> age nas manchas.', 'small'],
  [9.8, 13.0, 'Tudo com <span class="k">acompanhamento</span> do dentista.', 'small'],
  [13.0, 16.2, 'Pode dar <span class="k">sensibilidade</span> passageira.', 'small'],
  [16.2, 19.4, 'Antes, uma <span class="k">avaliação</span> diz se é indicado.', 'small'],
];
const GEL = [6.8, 12.8], FIM = 19.4; window.DUR = 23.4;
const SHADES = ['A3,5', 'A3', 'A2', 'A1', 'B1'];
document.getElementById('caps').innerHTML = CAPS.map(c => `<div class="cap ${c[3]||''}"><div>${c[2]}</div></div>`).join('');
const caps = [...document.querySelectorAll('.cap')], segs = [...CAPS.map(c => [c[0], c[1]]), [FIM, DUR]];
document.getElementById('bar').innerHTML = '<i><b></b></i>'.repeat(segs.length);
const fills = [...document.querySelectorAll('.bar b')];
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const back = x => { const c = 2.2; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const starSVG = '<svg viewBox="-50 -50 100 100"><path d="M0-48L8-8 48 0 8 8 0 48-8 8-48 0-8-8Z" fill="#fff"/><circle r="10" fill="#fff" opacity=".8"/></svg>';
const stars = Array.from({ length: 6 }, () => { const s = document.createElement('div'); s.className = 'star'; s.innerHTML = starSVG; document.getElementById('fx').appendChild(s); return s; });
let STARP = [];
window.EVENTS = () => { const ev = [{ t: .1, k: 'hook' }]; CAPS.slice(1).forEach(c => ev.push({ t: c[0], k: 'whoosh' }));
  ev.push({ t: GEL[0], k: 'sweep', d: 2.2 }); ev.push({ t: 9.2, k: 'move', d: 3.4 }); [8.0, 9.5, 11.0, 12.5].forEach(t => ev.push({ t, k: 'pop' }));
  [13.2, 13.7, 14.2, 14.7].forEach(t => ev.push({ t, k: 'sparkle' })); ev.push({ t: FIM, k: 'fim' }); return { dur: DUR, estilo: 'pop', events: ev.sort((a, b) => a.t - b.t) }; };
window.ready = (async () => {
  window.S = await initScene(document.getElementById('c'), 'http://local.test/m3d/dentition.glb', { gumU: { crown: .37, depth: 1.3 }, gumL: { crown: .42, depth: 1.3 } });
  const teeth = S.prims.filter(p => !p.gum && p.cejY !== undefined);
  STARP = teeth.filter(p => p.center[2] > 2.3).sort((a, b) => Math.abs(a.center[0]) - Math.abs(b.center[0])).slice(0, 6).map(p => { const r = Math.hypot(p.center[0], p.center[2] - .9); const dir = p.lower ? 1 : -1; return [p.center[0] * (r + .12) / r, p.cejY + dir * p.crownH * .55, .9 + (p.center[2] - .9) * (r + .12) / r]; });
  return true;
})();
function camAt(t) { const yaw = -.22 + .08 * Math.sin(t * .3) + (t > 12.8 ? .44 * eio(clamp((t - 12.8) / 4.5)) : 0);
  const dist = 6.4 - .8 * eio(clamp((t - 3.2) / 2.5)) + .8 * eio(clamp((t - 12.6) / 3)); const tg = [0, 1.14, 2.42];
  return { eye: [tg[0] + Math.sin(yaw) * dist, tg[1] + .1, tg[2] + Math.cos(yaw) * dist], target: tg, fov: .42 }; }
const YEL = [1.0, .76, .45], WHT = [1.03, 1.0, .97];
window.setT = t => {
  const cam = camAt(t);
  const w = eio(clamp((t - 7.4) / 5.2));                  // clareando
  const tint = YEL.map((v, i) => v + (WHT[i] - v) * w);
  const gel = t > GEL[0] && t < GEL[1] ? clamp((t - GEL[0]) / .6) * clamp((GEL[1] - t) / .6) : 0;
  S.draw(cam, { L1: [.25, .45, .9], expo: .72, tint: p => tint, glow: gel * (.55 + .2 * Math.sin(t * 6)) });
  // luz azul do clareamento
  const g = document.getElementById('glow'); const q = S.project(cam, [0, 1.12, 2.8]); g.style.left = q[0] + 'px'; g.style.top = q[1] + 'px';
  g.style.width = g.style.height = '1100px'; g.style.margin = '-550px 0 0 -550px'; g.style.background = 'radial-gradient(ellipse 60% 35% at 50% 50%,rgba(90,170,255,.55),rgba(60,120,255,0) 70%)'; g.style.opacity = gel;
  const mes = document.getElementById('mes'); mes.style.opacity = t > 6.8 && t < 14.4 ? clamp((t - 6.8) / .3) * clamp((14.4 - t) / .4) : 0;
  const si = Math.min(SHADES.length - 1, Math.floor(w * (SHADES.length - .001))); document.getElementById('mesn').textContent = 'COR ' + SHADES[si]; document.getElementById('mesb').style.width = w * 100 + '%';
  stars.forEach((s, i) => { const lt = t - (13.2 + i * .4); const kk = lt < 0 ? 0 : Math.sin(clamp(lt / 1) * Math.PI); const p2 = S.project(cam, STARP[i]);
    s.style.left = p2[0] + 'px'; s.style.top = p2[1] + 'px'; s.style.opacity = t > FIM ? 0 : kk; s.style.transform = `rotate(${lt * 80}deg) scale(${.4 + .8 * kk})`; });
  CAPS.forEach((c, i) => { const lt = t - c[0], d = c[1] - c[0]; caps[i].style.opacity = (lt < 0 || lt > d) ? 0 : clamp(lt / .3) * clamp((d - lt) / .25); caps[i].style.transform = `translateY(${(1 - ease(clamp(lt / .4))) * 40}px)`; });
  segs.forEach((s, i) => fills[i].style.width = clamp((t - s[0]) / (s[1] - s[0])) * 100 + '%');
  const f = clamp((t - FIM) / .5), fim = document.getElementById('fim'); fim.style.opacity = f; fim.querySelector('.q').style.transform = `translateY(${(1 - ease(f)) * 50}px)`;
  const fo = fim.querySelector('.follow'); fo.style.transform = `scale(${t < FIM + 1.2 ? .4 + .6 * back(clamp((t - FIM - .6) / .5)) : 1 + .05 * Math.sin((t - FIM - 1.2) * 5)})`; fo.style.opacity = clamp((t - FIM - .6) * 4);
  document.body.style.opacity = clamp(t / .3);
};
</script>
</body></html>
