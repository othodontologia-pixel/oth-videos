<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:"DM Sans",sans-serif;color:#fff;background:#140406}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 55% at 50% 42%,transparent 40%,rgba(8,2,3,.92) 100%)}
#topfade{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(#0b0203 0%,rgba(11,2,3,.85) 45%,transparent 100%)}
.brand{position:absolute;top:110px;left:60px;display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700}
.brand .av{width:74px;height:74px;border-radius:50%;background:#4fd1c5;display:flex;align-items:center;justify-content:center}
.bar{position:absolute;top:60px;left:50px;right:50px;display:flex;gap:10px}
.bar i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:#fff}
.cap{position:absolute;left:70px;right:70px;top:240px;height:330px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0}
.cap div{font-size:82px;font-weight:800;line-height:1.1;letter-spacing:-2px;text-shadow:0 4px 30px rgba(0,0,0,.7)}
.cap.small div{font-size:70px}
.cap .k{color:#5fe0d3}
#tag{position:absolute;bottom:250px;left:0;right:0;display:flex;justify-content:center}
#tag span{font-size:34px;font-weight:800;letter-spacing:8px;padding:14px 40px;border-radius:999px;border:3px solid currentColor;background:rgba(0,0,0,.45)}
#beam{position:absolute;top:560px;height:1100px;width:220px;margin-left:-110px;opacity:0;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(170,255,245,.55),rgba(79,209,197,0) 70%)}
#beam i{position:absolute;left:104px;top:40px;bottom:40px;width:12px;border-radius:6px;background:linear-gradient(transparent,#effffd 20%,#effffd 80%,transparent);box-shadow:0 0 30px 8px rgba(160,255,245,.8)}
.drop{position:absolute;border-radius:50%;background:rgba(220,252,255,.9);box-shadow:0 0 8px rgba(200,250,255,.9)}
.star{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;opacity:0}
#fim{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px;opacity:0;background:rgba(8,2,3,.86)}
#fim .q{font-size:92px;font-weight:800;line-height:1.1;letter-spacing:-2px}
#fim .q .k{color:#5fe0d3}
#fim .follow{margin-top:80px;padding:38px 70px;border-radius:999px;background:#4fd1c5;color:#06141c;font-size:52px;font-weight:800}
#fim .sub{margin-top:36px;font-size:42px;color:rgba(255,255,255,.75)}
#credit{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:24px;color:rgba(255,255,255,.5);letter-spacing:1px}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="vig"></div><div id="topfade"></div>
<div id="beam"><i></i></div><div id="fx"></div>
<div class="bar" id="bar"></div>
<div class="brand"><div class="av"><svg width="40" height="44" viewBox="0 0 100 110"><path d="M50 14C40 4 14 2 10 26c-3 18 6 30 10 52 3 18 8 28 14 28 7 0 7-26 16-26s9 26 16 26c6 0 11-10 14-28 4-22 13-34 10-52C86 2 60 4 50 14z" fill="#06141c"/></svg></div>OTH Odontologia</div>
<div id="caps"></div>
<div id="tag"><span id="tagt">ANTES</span></div>
<div id="fim"><div class="q">Quando foi a sua <span class="k">última limpeza</span>?</div><div class="follow">Comenta aqui</div><div class="sub">Siga para mais dicas de odontologia</div></div>
<div id="credit">Animação 3D ilustrativa · Modelo: University of Dundee (CC BY 4.0)</div>
<script src="dental3d.js"></script>
<script>
const CAPS = [
  [0.2, 3.4, 'Seus dentes estão pedindo uma <span class="k">limpeza</span>.'],
  [3.4, 6.6, 'Isso é <span class="k">tártaro</span>: placa que endureceu no dente.', 'small'],
  [6.6, 9.6, 'A escova <span class="k">não remove</span> o tártaro.', 'small'],
  [9.6, 13.0, 'Só a <span class="k">limpeza profissional</span>.', 'small'],
  [13.0, 16.2, 'Gengiva <span class="k">saudável</span> e hálito melhor.', 'small'],
  [16.2, 19.4, 'Em geral, a cada <span class="k">6 meses</span>. Seu dentista indica o ideal.', 'small'],
];
const SW = [9.9, 12.8], FIM = 19.4; window.DUR = 23.4;
document.getElementById('caps').innerHTML = CAPS.map(c => `<div class="cap ${c[3]||''}"><div>${c[2]}</div></div>`).join('');
const caps = [...document.querySelectorAll('.cap')], segs = [...CAPS.map(c => [c[0], c[1]]), [FIM, DUR]];
document.getElementById('bar').innerHTML = '<i><b></b></i>'.repeat(segs.length);
const fills = [...document.querySelectorAll('.bar b')];
const fx = document.getElementById('fx');
const drops = Array.from({ length: 34 }, (_, i) => { const d = document.createElement('div'); d.className = 'drop'; fx.appendChild(d); return d; });
const starSVG = '<svg viewBox="-50 -50 100 100"><path d="M0-48L8-8 48 0 8 8 0 48-8 8-48 0-8-8Z" fill="#fff"/><circle r="10" fill="#fff" opacity=".8"/></svg>';
const stars = Array.from({ length: 7 }, () => { const s = document.createElement('div'); s.className = 'star'; s.innerHTML = starSVG; fx.appendChild(s); return s; });
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const back = x => { const c = 2.2; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
// câmeras: geral de cima -> aproximação nos incisivos -> volta
const CAM_WIDE = { eye: [0, 5.5, 2.15], target: [0, .9, 2.5] }, CAM_CLOSE = { eye: [0, 3.3, 2.2], target: [0, 1.0, 2.62] }, CAM_MID = { eye: [0, 4.5, 2.15], target: [0, .95, 2.55] };
function camAt(t) {
  let a = CAM_WIDE, b = CAM_WIDE, k = 0;
  if (t < 3.4) { a = CAM_WIDE; b = CAM_WIDE; }
  else if (t < 9.6) { a = CAM_WIDE; b = CAM_CLOSE; k = eio(clamp((t - 3.4) / 2.2)); }
  else if (t < 13) { a = CAM_CLOSE; b = CAM_MID; k = eio(clamp((t - 9.6) / 3.4)); }
  else { a = CAM_MID; b = CAM_WIDE; k = eio(clamp((t - 13) / 5)); }
  const drift = .03 * Math.sin(t * .4);
  const e = lerp(a.eye, b.eye, k), g = lerp(a.target, b.target, k);
  return { eye: [e[0] + drift, e[1] - .12 * (t / DUR), e[2]], target: g, fov: .6, up: [0, 0, 1] };
}
window.EVENTS = () => {
  const ev = [{ t: .1, k: 'hook' }]; CAPS.slice(1).forEach(c => ev.push({ t: c[0], k: 'whoosh' }));
  ev.push({ t: SW[0], k: 'sweep', d: SW[1] - SW[0] }); [13.1, 13.5, 13.9, 14.3].forEach(t => ev.push({ t, k: 'sparkle' })); ev.push({ t: FIM, k: 'fim' });
  return { dur: DUR, estilo: 'pop', events: ev };
};
window.ready = (async () => {
  window.S = await initScene(document.getElementById('c'), 'http://local.test/m3d/dentition.glb', { gumU: { crown: .37, depth: 1.3 }, gumL: { crown: .42, depth: 1.3 } });
  return true;
})();
window.setT = t => {
  const cam = camAt(t);
  const sp = eio(clamp((t - SW[0]) / (SW[1] - SW[0])));
  const sx = t < SW[0] ? -1e3 : (t > SW[1] ? 1e3 : -1.25 + sp * 2.5);
  S.draw(cam, { filter: p => p.lower, L1: cam.eye.map((v, i) => v - cam.target[i]), expo: .75, dirt: 1, infl: 1, sweep: sx, band: p => .17 });
  // feixe na tela
  const beam = document.getElementById('beam'); const on = t > SW[0] && t < SW[1] + .25;
  const bx = S.project(cam, [Math.max(-1.25, Math.min(1.25, sx)), 1.1, 2.2])[0];
  beam.style.opacity = on ? clamp((t - SW[0]) / .2) * clamp((SW[1] + .25 - t) / .25) : 0; beam.style.left = bx + 'px';
  drops.forEach((d, i) => { const ph = (t * 2.4 + i * .41) % 1; d.style.opacity = on && t < SW[1] ? (1 - ph) : 0; const sz = 6 + (i % 4) * 3;
    d.style.width = d.style.height = sz + 'px'; d.style.left = (bx + (i % 2 ? 1 : -.6) * (20 + ph * 170)) + 'px'; d.style.top = (640 + (i * 131) % 900 - ph * 90 + ph * ph * 200) + 'px'; });
  // brilhos sobre os incisivos
  const pts = [[-.08, 1.22, 2.68], [.22, 1.22, 2.66], [-.3, 1.22, 2.62], [.38, 1.2, 2.56], [-.42, 1.2, 2.52], [.08, 1.2, 2.6], [-.18, 1.2, 2.64]];
  stars.forEach((s, i) => { const lt = t - (13.1 + i * .38); const k = lt < 0 ? 0 : Math.sin(clamp(lt / 1) * Math.PI); const q = S.project(cam, pts[i]);
    s.style.left = q[0] + 'px'; s.style.top = q[1] + 'px'; s.style.opacity = t > FIM ? 0 : k; s.style.transform = `rotate(${lt * 80}deg) scale(${.4 + .8 * k})`; });
  // legendas e barra
  CAPS.forEach((c, i) => { const lt = t - c[0], d = c[1] - c[0]; caps[i].style.opacity = (lt < 0 || lt > d) ? 0 : clamp(lt / .3) * clamp((d - lt) / .25); caps[i].style.transform = `translateY(${(1 - ease(clamp(lt / .4))) * 40}px)`; });
  segs.forEach((s, i) => fills[i].style.width = clamp((t - s[0]) / (s[1] - s[0])) * 100 + '%');
  const tg = document.getElementById('tagt'), after = t > (SW[0] + SW[1]) / 2; tg.textContent = after ? 'DEPOIS' : 'ANTES'; tg.style.color = after ? '#5fe0d3' : '#ffd166';
  const fl = Math.abs(t - (SW[0] + SW[1]) / 2); tg.style.transform = `scale(${fl < .25 ? .7 + fl * 1.2 : 1})`;
  const f = clamp((t - FIM) / .5), fim = document.getElementById('fim'); fim.style.opacity = f; fim.querySelector('.q').style.transform = `translateY(${(1 - ease(f)) * 50}px)`;
  const fo = fim.querySelector('.follow'); fo.style.transform = `scale(${t < FIM + 1.2 ? .4 + .6 * back(clamp((t - FIM - .6) / .5)) : 1 + .05 * Math.sin((t - FIM - 1.2) * 5)})`; fo.style.opacity = clamp((t - FIM - .6) * 4);
  document.body.style.opacity = clamp(t / .3);
};
</script>
</body></html>
